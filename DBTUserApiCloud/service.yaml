apiVersion: v1
kind: Service
metadata:
  name: dbt4userapicloud-service
spec:
  selector:
    app: dbt4userapicloud
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080    # Specify a static port for NodePort
  type: NodePort        # Change the service type to NodePort